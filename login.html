<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TASK MANAGEMENT TRACKER — Login</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>


<div id="login-page">
  <div class="login-bg"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">✅</div>
      <div class="login-logo-text">Task Management Tracker <span>GIET University Project</span></div>
    </div>

    <div class="login-heading" id="login-heading">Welcome Back 👋</div>
    <div class="login-sub">Sign in or create an account to manage your tasks</div>

 
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">🔑 Login</button>
      <button class="auth-tab" id="tab-signup" onclick="switchTab('signup')">✨ Sign Up</button>
    </div>

   
    <div class="login-error" id="login-error">⚠️ <span id="error-text"></span></div>


    <div class="login-field name-only" id="field-name">
      <div class="login-label"><span class="lbl-icon">👤</span> Full Name</div>
      <div class="input-wrap">
        <span class="input-icon">👤</span>
        <input class="login-input" id="inp-name" type="text" placeholder="Enter your full name" oninput="validateName()" autocomplete="name" />
      </div>
      <div class="field-hint" id="hint-name"></div>
    </div>

  
    <div class="login-field">
      <div class="login-label"><span class="lbl-icon">📧</span> Email Address</div>
      <div class="input-wrap">
        <span class="input-icon">📧</span>
        <input class="login-input" id="inp-email" type="email" placeholder="you@example.com" oninput="validateEmail()" autocomplete="email" />
      </div>
      <div class="field-hint" id="hint-email"></div>
    </div>

   
    <div class="login-field">
      <div class="login-label"><span class="lbl-icon">🔒</span> Password <span style="color:var(--muted);font-size:10px;font-weight:400;letter-spacing:0;text-transform:none;margin-left:4px">(min. 6 characters)</span></div>
      <div class="input-wrap">
        <span class="input-icon">🔒</span>
        <input class="login-input" id="inp-pwd" type="password" placeholder="••••••••" oninput="validatePwd()" autocomplete="current-password" />
        <button class="input-eye" id="eye-btn" onclick="toggleEye()" type="button">👁️</button>
      </div>
      <div class="field-hint" id="hint-pwd"></div>
     
      <div class="pwd-strength name-only" id="pwd-strength">
        <div class="pwd-bar-track"><div class="pwd-bar-fill" id="pwd-bar"></div></div>
        <div class="pwd-bar-label" id="pwd-bar-label">Strength: —</div>
      </div>
    </div>

    <button class="login-btn" id="submit-btn" onclick="handleSubmit()">
      <span id="btn-label">🔑 Login</span>
    </button>

    <div class="login-divider">or</div>
    <div class="login-footer">
      By continuing you agree to our <strong>Terms of Service</strong> &amp; <strong>Privacy Policy</strong>
    </div>
  </div>
</div>


<div class="login-success-overlay" id="success-overlay">
  <div class="success-icon">✅</div>
  <div class="success-msg" id="success-msg">Welcome back!</div>
  <div class="success-sub">Loading your tasks…</div>
</div>

<script src="script.js"></script>
<script>

  window.addEventListener('DOMContentLoaded', () => {
    const s = getSession();
    if (s && s.email) {
      window.location.href = 'index.html';
    }
  });
</script>
</body>
</html>
